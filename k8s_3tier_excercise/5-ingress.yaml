apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress-secure
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: cluster-wide-ingress
  tls:
  - hosts:
    - frontend.192.168.111.129.nip.io
    secretName: frontend-tls-secret
  rules:
    - host: frontend.192.168.111.129.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress-http-redirect
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-frontend-redirect-to-https@kubernetescrd
spec:
  ingressClassName: cluster-wide-ingress
  rules:
    - host: frontend.192.168.111.129.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: frontend-redirect-to-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true