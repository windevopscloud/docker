apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
data:
  app.py: |
    import os, json, psycopg2
    from http.server import BaseHTTPRequestHandler, HTTPServer

    def db():
        return psycopg2.connect(host=os.environ["DB_HOST"], user="postgres",
                                password=os.environ["DB_PASSWORD"],
                                dbname="postgres", connect_timeout=3)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                code, body = 200, {"status": "ok"}
            else:
                try:
                    conn = db(); cur = conn.cursor()
                    cur.execute("CREATE TABLE IF NOT EXISTS visits (id SERIAL PRIMARY KEY, ts TIMESTAMP DEFAULT now(), pod TEXT)")
                    cur.execute("INSERT INTO visits(pod) VALUES (%s)", (os.uname().nodename,))
                    cur.execute("SELECT count(*) FROM visits")
                    n = cur.fetchone()[0]
                    conn.commit(); conn.close()
                    code, body = 200, {"visits": n, "served_by": os.uname().nodename}
                except Exception as e:
                    code, body = 500, {"error": str(e)}
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps(body).encode())

    HTTPServer(("0.0.0.0", 5000), H).serve_forever()