apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-service1
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-service1@kubernetescrd
    #traefik.ingress.kubernetes.io/router.middlewares: default-redirect-to-https@kubernetescrd
spec:
  ingressClassName: cluster-wide-ingress
  tls:
  - hosts:
    - 192.168.111.129   # Or your domain/LoadBalancer IP
    - 192.168.111.240
    secretName: tls-secret-service1
  rules:
  - http:
      paths:
      - path: /service1
        pathType: Prefix
        backend:
          service:
            name: svc-service1
            port:
              number: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: strip-service1
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /service1
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: default-redirect-to-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: service1-ingressroute
  namespace: default
spec:
  entryPoints:
    - web
    - websecure		# <-- Only listen on port 443 (HTTPS)
  routes:
  - match: PathPrefix(`/service1`)
    kind: Rule
    middlewares:
    - name: strip-service1
      namespace: default
    services:
    - name: svc-service1
      port: 80
  tls:
    secretName: tls-secret-service1
---
apiVersion: v1
kind: Service
metadata:
  name: svc-service1
spec:
  selector:
    app: app-service1
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-service1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-service1
  template:
    metadata:
      labels:
        app: app-service1
    spec:
      containers:
      - name: service1
        image: nginx:alpine
        ports:
        - containerPort: 80
        command: ["/bin/sh"]
        args: ["-c", "echo 'Welcome to MicroService 1' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
