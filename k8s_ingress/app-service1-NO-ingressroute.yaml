apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: native-ssl-offload-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-service1@kubernetescrd
spec:
  ingressClassName: cluster-wide-ingress
  tls:
  - hosts:
    - 192.168.111.129.nip.io
    secretName: tls-secret-service1
  rules:
  - host: 192.168.111.129.nip.io
    http:
      paths:
      - path: /service1
        pathType: Prefix
        backend:
          service:
            name: svc-service1
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-to-https-redirect
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: http
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-to-https@kubernetescrd
spec:
  ingressClassName: cluster-wide-ingress
  rules:
  - host: 192.168.111.129.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: svc-service1
            port:
              number: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: strip-service1
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /service1
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
